<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>gnews</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main id="grid" class="grid" aria-label="Channels">
      <button class="tile" type="button" data-channel="abc" aria-label="ABC57">
        <img src="assets/abc.png" alt="ABC">
      </button>
      <button class="tile" type="button" data-channel="cbs" aria-label="WSBT 22 CBS">
        <img src="assets/cbs.png" alt="CBS">
      </button>
      <button class="tile" type="button" data-channel="nbc" aria-label="WNDU 16 News Now NBC">
        <img src="assets/nbc.png" alt="NBC">
      </button>
      <button class="tile" type="button" data-channel="roar" aria-label="ROAR">
        <img src="assets/roar.png" alt="ROAR">
      </button>
    </main>

    <section id="playback" class="playback" aria-live="polite" hidden>
      <div id="spinner" class="spinner" aria-label="Loading"></div>
      <div id="error" class="error" hidden>Stream unavailable</div>
      <video id="video" autoplay playsinline preload="auto"></video>
    </section>

    <script src="core.js"></script>
    <script src="app.js"></script>
  </body>
</html>
