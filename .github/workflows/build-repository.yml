name: Build Homebrew repository

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'branding/**'
      - 'scripts/**'
      - '.github/workflows/build-repository.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out gtv
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: branding/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install branding dependencies
        run: python -m pip install --disable-pip-version-check -r branding/requirements.txt

      - name: Prepare verified Pricedown Black font
        shell: bash
        run: |
          set -euo pipefail
          FONT_PATH="$RUNNER_TEMP/gtv-fonts/Pricedown Bl.otf"
          python scripts/prepare-branding-font.py --output "$FONT_PATH"
          echo "GTV_PRICEDOWN_FONT=$FONT_PATH" >> "$GITHUB_ENV"

      - name: Test smart icon renderer
        run: python scripts/test-smart-icon.py

      - name: Test launcher icon discovery
        run: python scripts/test-icon-sources.py

      - name: Test GTV version convention
        run: python scripts/test-versioning.py

      - name: Generate and test gnews
        shell: bash
        run: |
          set -euo pipefail
          python apps/gnews/assets/generate.py \
            --font "$GTV_PRICEDOWN_FONT" \
            --output apps/gnews/src/assets
          node --test apps/gnews/tests/*.mjs
          python apps/gnews/tests/test-package-contract.py

      - name: Verify gnews public streams
        run: python scripts/verify-gnews-streams.py

      - name: Test YouTube sponsored feed filter
        run: node apps/youtube-adfree/tests/test-feed-ad-filter.mjs apps/youtube-adfree/patches/feed-ad-filter.js

      - name: Test YouTube Shorts filter
        run: node apps/youtube-adfree/tests/test-shorts-filter.mjs apps/youtube-adfree/patches/shorts-filter.js

      - name: Test YouTube sponsored playback overlay filter
        run: node apps/youtube-adfree/tests/test-playback-overlay-filter.mjs apps/youtube-adfree/patches/playback-overlay-filter.js

      - name: Test YouTube JSON stringify hook
        run: node --experimental-strip-types apps/youtube-adfree/tests/test-json-stringify-hook.mjs apps/youtube-adfree/patches/json-stringify.ts

      - name: Build patched applications
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="$GITHUB_WORKSPACE/apps/lg-app-update-blocker"
          SRC="$RUNNER_TEMP/lg-app-update-blocker"
          rm -rf "$SRC"

          git clone https://github.com/dr0dr1dr2dr3/lgappupdateblocker.git "$SRC"
          git -C "$SRC" checkout 9e48b292ce8fc7e776feb85763314e66c2061d02

          python3 "$APP_DIR/patches/apply.py" "$SRC" "$APP_DIR/patches" "$APP_DIR/app.json"
          python3 "$GITHUB_WORKSPACE/scripts/build-smart-icon.py" \
            --metadata "$APP_DIR/app.json" \
            --source "$SRC" \
            --repository-icon "$GITHUB_WORKSPACE/repo/icons/lg-app-update-blocker.png"

          cd "$SRC"
          npm install
          npm run build
          npm run package

          mkdir -p "$GITHUB_WORKSPACE/repo/packages"
          IPK=$(find . -maxdepth 1 -type f -name '*.ipk' -print -quit)
          test -n "$IPK"
          cp "$IPK" "$GITHUB_WORKSPACE/repo/packages/lg-app-update-blocker.ipk"

          APP_DIR="$GITHUB_WORKSPACE/apps/youtube-adfree"
          SRC="$RUNNER_TEMP/youtube-webos"
          rm -rf "$SRC"

          git clone https://github.com/webosbrew/youtube-webos.git "$SRC"
          git -C "$SRC" checkout f1b3b72926bb0cc312b5ceddc6a5b8c8ca081914
          cp "$SRC/LICENSE" "$APP_DIR/LICENSE"

          python3 "$APP_DIR/patches/apply.py" "$SRC" "$APP_DIR/patches" "$APP_DIR/app.json"
          node "$APP_DIR/tests/test-feed-ad-filter.mjs" "$SRC/src/feed-ad-filter.js"
          node "$APP_DIR/tests/test-adblock-integration.mjs" "$SRC/src/adblock.js" "$SRC/src/userScript.ts"
          node "$APP_DIR/tests/test-shorts-filter.mjs" "$SRC/src/shorts-filter.js"
          node "$APP_DIR/tests/test-playback-overlay-filter.mjs" "$SRC/src/playback-overlay-filter.js"
          node --experimental-strip-types "$APP_DIR/tests/test-json-stringify-hook.mjs" "$SRC/src/hooks/json-stringify.ts"
          python3 "$GITHUB_WORKSPACE/scripts/build-smart-icon.py" \
            --metadata "$APP_DIR/app.json" \
            --source "$SRC" \
            --repository-icon "$GITHUB_WORKSPACE/repo/icons/youtube-adfree.png"

          cd "$SRC"
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run lint:tsc
          pnpm run build
          pnpm run test:compat
          pnpm run package

          IPK=$(find . -maxdepth 1 -type f -name '*.ipk' -print -quit)
          test -n "$IPK"
          cp "$IPK" "$GITHUB_WORKSPACE/repo/packages/youtube-adfree.ipk"

          cd "$GITHUB_WORKSPACE"
          python scripts/build-webos-app.py \
            --metadata apps/gnews/app.json \
            --source apps/gnews/src \
            --output repo/packages/gnews.ipk
          cp apps/gnews/src/assets/icon.png repo/icons/gnews.png

      - name: Promote YouTube DEV build into main feed
        shell: bash
        run: |
          set -euo pipefail
          DEV_RAW="https://raw.githubusercontent.com/polskiftw/gtv/dev"

          cp apps/youtube-adfree/app.json "$RUNNER_TEMP/youtube-adfree-release-app.json"
          curl --fail --location --retry 3 --retry-delay 2 \
            "$DEV_RAW/apps/youtube-adfree/app.json" \
            -o apps/youtube-adfree/app.json
          curl --fail --location --retry 3 --retry-delay 2 \
            "$DEV_RAW/repo/packages/youtube-adfree.ipk" \
            -o repo/packages/youtube-adfree.ipk
          curl --fail --location --retry 3 --retry-delay 2 \
            "$DEV_RAW/repo/icons/youtube-adfree.png" \
            -o repo/icons/youtube-adfree.png

          python - <<'PY'
          import json
          from pathlib import Path

          metadata = json.loads(Path('apps/youtube-adfree/app.json').read_text(encoding='utf-8'))
          if metadata.get('id') != 'youtube.leanback.v4':
              raise SystemExit('DEV metadata changed application ID')
          if metadata.get('version') != '6690.5.3':
              raise SystemExit(f"unexpected DEV version: {metadata.get('version')!r}")
          PY

      - name: Generate Homebrew Channel feed
        run: python3 scripts/build-repository.py

      - name: Validate generated repository
        run: python scripts/validate-repository.py

      - name: Restore release YouTube source metadata
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/youtube-adfree-release-app.json" apps/youtube-adfree/app.json

      - name: Publish generated repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add repo/ apps/*/LICENSE apps/gnews/src/assets
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Build Homebrew repository'
          git push
