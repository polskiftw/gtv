name: Build LG App Update Blocker

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/lg-app-update-blocker/**'
      - 'branding/**'
      - 'scripts/badge_finish.py'
      - 'scripts/build-smart-icon.py'
      - 'scripts/icon_sources.py'
      - 'scripts/prepare-branding-font.py'
      - 'scripts/smart_badge.py'
      - 'scripts/test-icon-sources.py'
      - 'scripts/test-smart-icon.py'
      - 'scripts/test-versioning.py'
      - 'scripts/versioning.py'
  push:
    branches: [main]
    paths:
      - 'apps/lg-app-update-blocker/**'
      - 'branding/**'
      - 'scripts/badge_finish.py'
      - 'scripts/build-smart-icon.py'
      - 'scripts/icon_sources.py'
      - 'scripts/prepare-branding-font.py'
      - 'scripts/smart_badge.py'
      - 'scripts/test-icon-sources.py'
      - 'scripts/test-smart-icon.py'
      - 'scripts/test-versioning.py'
      - 'scripts/versioning.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out gtv
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: branding/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install branding dependencies
        run: python -m pip install --disable-pip-version-check -r branding/requirements.txt

      - name: Prepare verified Pricedown Black font
        shell: bash
        run: |
          set -euo pipefail
          FONT_PATH="$RUNNER_TEMP/gtv-fonts/Pricedown Bl.otf"
          python scripts/prepare-branding-font.py --output "$FONT_PATH"
          echo "GTV_PRICEDOWN_FONT=$FONT_PATH" >> "$GITHUB_ENV"

      - name: Test shared branding/version helpers
        run: |
          python scripts/test-smart-icon.py
          python scripts/test-icon-sources.py
          python scripts/test-versioning.py

      - name: Build LG App Update Blocker only
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="$GITHUB_WORKSPACE/apps/lg-app-update-blocker"
          SRC="$RUNNER_TEMP/lg-app-update-blocker"
          rm -rf "$SRC"

          git clone https://github.com/dr0dr1dr2dr3/lgappupdateblocker.git "$SRC"
          git -C "$SRC" checkout 9e48b292ce8fc7e776feb85763314e66c2061d02

          python3 "$APP_DIR/patches/apply.py" "$SRC" "$APP_DIR/patches" "$APP_DIR/app.json"
          node "$APP_DIR/tests/test-persistence-patch.mjs" "$SRC/service/service.js"
          python3 "$GITHUB_WORKSPACE/scripts/build-smart-icon.py" \
            --metadata "$APP_DIR/app.json" \
            --source "$SRC" \
            --repository-icon "$GITHUB_WORKSPACE/repo/icons/lg-app-update-blocker.png"

          cd "$SRC"
          npm install
          npm run build
          npm run package

          mkdir -p "$GITHUB_WORKSPACE/repo/packages"
          IPK=$(find . -maxdepth 1 -type f -name '*.ipk' -print -quit)
          test -n "$IPK"
          cp "$IPK" "$GITHUB_WORKSPACE/repo/packages/lg-app-update-blocker.ipk"

      - name: Stage current YouTube DEV metadata for feed generation
        shell: bash
        run: |
          set -euo pipefail
          DEV_RAW="https://raw.githubusercontent.com/polskiftw/gtv/dev"
          cp apps/youtube-adfree/app.json "$RUNNER_TEMP/youtube-adfree-main-app.json"
          curl --fail --location --retry 3 --retry-delay 2 \
            "$DEV_RAW/apps/youtube-adfree/app.json" \
            -o apps/youtube-adfree/app.json
          curl --fail --location --retry 3 --retry-delay 2 \
            "$DEV_RAW/repo/packages/youtube-adfree.ipk" \
            -o repo/packages/youtube-adfree.ipk
          curl --fail --location --retry 3 --retry-delay 2 \
            "$DEV_RAW/repo/icons/youtube-adfree.png" \
            -o repo/icons/youtube-adfree.png

      - name: Generate and validate Homebrew feed
        run: |
          python3 scripts/build-repository.py
          python scripts/validate-repository.py

      - name: Restore main-branch YouTube source metadata
        run: cp "$RUNNER_TEMP/youtube-adfree-main-app.json" apps/youtube-adfree/app.json

      - name: Publish generated repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add repo/ apps/lg-app-update-blocker/LICENSE
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Build LG App Update Blocker'
          git push
