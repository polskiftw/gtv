name: Promote YouTube DEV build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stage YouTube DEV package and metadata
        shell: bash
        run: |
          set -euo pipefail
          DEV_RAW="https://raw.githubusercontent.com/polskiftw/gtv/dev"
          cp apps/youtube-adfree/app.json "$RUNNER_TEMP/youtube-adfree-main-app.json"

          curl --fail --location --retry 3 --retry-delay 2 \
            "$DEV_RAW/apps/youtube-adfree/app.json" \
            -o apps/youtube-adfree/app.json
          curl --fail --location --retry 3 --retry-delay 2 \
            "$DEV_RAW/repo/packages/youtube-adfree.ipk" \
            -o repo/packages/youtube-adfree.ipk
          curl --fail --location --retry 3 --retry-delay 2 \
            "$DEV_RAW/repo/icons/youtube-adfree.png" \
            -o repo/icons/youtube-adfree.png

          python - <<'PY'
          import json
          from pathlib import Path

          metadata = json.loads(Path('apps/youtube-adfree/app.json').read_text(encoding='utf-8'))
          if metadata.get('id') != 'youtube.leanback.v4':
              raise SystemExit('DEV metadata changed application ID')
          PY

      - name: Generate and validate Homebrew feed
        run: |
          python3 scripts/build-repository.py
          python scripts/validate-repository.py

      - name: Restore main-branch YouTube source metadata
        run: cp "$RUNNER_TEMP/youtube-adfree-main-app.json" apps/youtube-adfree/app.json

      - name: Publish promoted YouTube DEV build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add repo/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Promote YouTube DEV build'
          git push
